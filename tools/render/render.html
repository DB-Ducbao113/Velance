<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const W = 3840, H = 2160;
const renderer = new THREE.WebGPURenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });

const scene = new THREE.Scene();

scene.environment = pmrem.fromScene(room, .04).texture;

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3340, .55));

const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const POSES = [
  ['01-front-three-quarter', 35, 12, 7.2],
  ['02-near-front', 12, 7, 6.2],
  ['03-side-profile', 90, 5, 7.6],

  });
